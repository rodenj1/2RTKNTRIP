name: build-image
# Drop this file into the FORK repo at .github/workflows/build-image.yml
# (rodenj1/2RTKNTRIP after you fork ursereg/2RTKNTRIP).
# It builds the fork's own Dockerfile and pushes to GHCR so ArgoCD can pull it.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/2rtkntrip
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Report digest
        run: echo "Pushed digest ${{ steps.meta.outputs.tags }}"
# After the run: make the GHCR package public (Packages -> 2rtkntrip -> Settings ->
# Change visibility -> Public) OR add an imagePullSecret in the ntrip-fork namespace.
# Then set the deployment image to ghcr.io/rodenj1/2rtkntrip@sha256:<digest>.
